{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-warning">
            <div class="card-header bg-warning text-dark">
                <h5 class="card-title mb-0">Edit Item</h5>
            </div>
            <div class="card-body">
                <form action="/edit/{{ item.id }}" method="POST">
                    <div class="mb-3">
                        <label for="itemTitle" class="form-label fw-bold">Update Title</label>
                        <input type="text" id="itemTitle" name="title" class="form-control" value="{{ item.title }}" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
